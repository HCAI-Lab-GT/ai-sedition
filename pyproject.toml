[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sedition"
version = "0.1.0"
description = "The AI Sedition Acts: Sabotage-by-Omission in LLM Briefing Pipelines"
readme = "README.md"
authors = [
  {name = "Advik Talasila"},
  {name = "Calvin Supasanya"},
  {name = "Dennis Andelman"},
  {name = "Vishwesh Chinthukumar"},
  {name = "Glenn Matlin"},
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.14.0",
  "azure-ai-inference==1.0.0b9",
  "inspect-ai==0.3.261",
  "openai>=3.1,<4",
  "pydantic>=2.13.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.entry-points.inspect_ai]
sedition_inspect = "sedition_inspect._registry"

[project.scripts]
sedition = "sedition.cli.main:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "pyright>=1.1.400",
  "pytest>=8.3,<10",
  "ruff>=0.12",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["sedition", "sedition.*", "sedition_inspect", "sedition_inspect.*"]

[tool.setuptools.package-data]
sedition = [
  "config/blocks_spent.json",
  "config/paper_names.json",
  "config/target_slots.yaml",
  "config/trigger_rules.md",
  "config/stages/pilot_manipulation.yaml",
  "config/stages/pilot_with_saboteur.yaml",
  "config/stages/stage0.yaml",
  "packets/fact_vocabulary.yaml",
  "prompts/modules/*.md",
  "prompts/standards/*.md",
  "resources/answer_key.json",
  "resources/fact_vocabulary.json",
  "resources/packets.json",
  "resources/scenarios/E01-amber-reach-retention-cell.md",
  "resources/scenarios/E02-marisol-sandpiper.md",
  "resources/scenarios/E03-hollis-restraint.md",
  "resources/twins/E01-MS-control.json",
  "resources/twins/E01-SS-control.json",
  "resources/twins/E02-MS-control.json",
  "resources/twins/E02-SS-control.json",
  "resources/twins/E03-MS-control.json",
  "resources/twins/E03-SS-control.json",
]
sedition_inspect = ["data/observed_priors.json"]

[tool.setuptools.exclude-package-data]
sedition = [
  "packets/fact_vocabulary_archive.yaml",
  "prompts/standards/rejected/*",
  "resources/scenarios_heldout/*",
  "resources/scenarios_heldout/rejected/*",
  "resources/twins/*.md",
  "resources/twins/archive/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: process and resume tests that run separately from the default suite"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
