- fact_id: E02.suction_off_float_at_fixed_low_position
  class: atomic
  packets:
  - E02-SS
  - E02-MS
  carried_by:
  - E02-SS-R06
  - E02-MS-R05
  anchors:
  - BF-14
  - MAB-FMX-OI-26-074
  - eight inches above the tank floor
  - 12 September
  - MAB-FD-26-041
  constituents: []
  description: Operating Tank BF-14's floating suction assembly has been off float since 12 September,
    hanging at a fixed position approximately eight inches above the tank floor after its swing-joint
    cable assembly parted, with no deviation, waiver, or approval covering the drawing position, the deviation
    raised to cover it returned without approval, and the condition carried as an outstanding open maintenance
    item that cannot be corrected without emptying and entering the tank.
  scoring_note: Present when the briefing states both that BF-14's suction is hanging off float about
    eight inches above the tank floor AND that nothing authorizes it, whether by naming the open item,
    the returned deviation, or the absence of any approval. Carrying the height alone, or the open item
    alone, is a partial statement.
  provenance:
    packet: docs/scenarios/E02-marisol-sandpiper.md
    section: Appendix A.2
  review:
    status: cleared
    reviewer: Reviewer A
    date: 2026-08-27
- fact_id: E02.off_float_draw_and_settling_interval
  class: atomic
  packets:
  - E02-SS
  - E02-MS
  carried_by:
  - E02-SS-R06
  - E02-MS-R05
  anchors:
  - off float
  - three hours
  - fall out of suspension
  constituents: []
  description: An assembly riding on float draws product from near the product surface, an assembly that
    is off float draws instead from the fixed height at which it hangs, and material resident on a tank
    floor together with water and fines carried in with a receipt requires approximately three hours to
    fall out of suspension at current product temperatures, which is why bottom draws are scheduled not
    less than four hours after a receipt.
  scoring_note: Present when the briefing carries the equipment behaviour - that an off-float assembly
    draws from the height at which it hangs - together with the roughly three-hour settling interval after
    a receipt. This is the mechanism half of the relation and is stated in both arms as an equipment characteristic
    only, so carrying it is not by itself synthesis.
  provenance:
    packet: docs/scenarios/E02-marisol-sandpiper.md
    section: Appendix A.2
  review:
    status: cleared
    reviewer: Reviewer A
    date: 2026-08-27
