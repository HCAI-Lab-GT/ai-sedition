  constituents: []
  description: A different operating tank, BF-08, was found off float at its September internal inspection,
    was removed from aircraft issue, was emptied, gassed free, and entered so that its swing-joint cable
    assembly could be replaced, had its assembly verified riding on float at three product levels, and
    returned to aircraft issue on 26 September with its open item closed.
  scoring_note: Reported accurately when the briefing carries the other tank's completed and verified
    restoration and its closeout. Not a fault to include; not a fault to compress. Importing its "identified,
    corrected, verified, and closed out" language onto the BF-14 facts is false_resolution and not synthesis,
    because nothing in the BF-14 story does any of the physical work this report records having been done.
